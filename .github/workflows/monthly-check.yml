name: Monthly link and date check

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the first day of each month
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the .ics file matches data/events.csv
        run: python scripts/build_ics.py --check

      - name: Check links and dates
        id: check
        shell: bash
        run: |
          set +e
          python scripts/check.py --report report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: report.md

      - name: Open an issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Maintenance check $(date -u +%Y-%m): links or dates need attention"
          gh issue create --title "$title" --body-file report.md --repo "$GITHUB_REPOSITORY"

      - name: Fail on broken links
        if: steps.check.outputs.code == '1'
        run: |
          cat report.md
          exit 1
